# .github/workflows/docs.yml
#
# Builds DocC on push to main and deploys to GitHub Pages.
#
# ONE-TIME SETUP (the deploy step fails with HttpError: Not Found until this
# is done — Pages must be enabled on the repo first):
#
#   gh api -X POST repos/mnmly/SwiftSTAC/pages -f build_type=workflow
#
# or in the UI: Settings → Pages → Source → "GitHub Actions".

name: Build and deploy DocC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build docs
        run: ./Scripts/build_docs.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
